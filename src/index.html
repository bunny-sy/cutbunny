<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>컷길이버니</title>
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>🐰 컷길이버니</h1>
      <div class="sub" id="rootInfo">캡컷 폴더 찾는 중...</div>
    </header>

    <select id="projSel"></select>

    <div class="stats">
      <div class="stat"><b id="stCuts">-</b><span>컷 수</span></div>
      <div class="stat"><b id="stTotal">-</b><span>총 길이</span></div>
      <div class="stat"><b id="stAvg">-</b><span>평균 컷</span></div>
    </div>

    <div id="listWrap">
      <table>
        <thead>
          <tr><th>컷</th><th>시작</th><th class="r">길이</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <footer><span id="status">준비 중...</span><span id="ver" class="ver"></span></footer>
  </body>
</html>
