name: release

# v로 시작하는 태그를 push하면 맥+윈도 빌드 → 릴리즈(초안) 생성
# (초안이라 자동업데이트/수강생에겐 안 보임. 확인 후 직접 publish)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # 인텔 + 애플실리콘 겸용(유니버설)
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 맥: 번들할 정적 ffmpeg(arm64) 다운로드
      - name: Prepare macOS ffmpeg
        if: matrix.platform == 'macos-latest'
        run: |
          BASE=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl -L -o /tmp/ffmpeg-arm64 $BASE/ffmpeg-darwin-arm64
          curl -L -o /tmp/ffmpeg-x64   $BASE/ffmpeg-darwin-x64
          # 인텔+애플실리콘 합쳐 하나로 (유니버설). 안 합치면 인텔에서 썸네일이 안 나옴
          lipo -create -output src-tauri/bin/ffmpeg /tmp/ffmpeg-arm64 /tmp/ffmpeg-x64
          chmod +x src-tauri/bin/ffmpeg
          # 맥은 서명 없는 실행파일을 거부 → 번들 전에 임시 서명 (안 하면 앱이 "손상됨")
          codesign --force --sign - --timestamp=none src-tauri/bin/ffmpeg
          lipo -info src-tauri/bin/ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Build & Release (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 맥: 임시(ad-hoc) 서명 — 애플 유료 인증 없이 "손상됨" 대신 "확인 안 된 개발자"로
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CutCheck ${{ github.ref_name }}'
          releaseBody: '컷체크 업데이트 🐰 (맥/윈도)'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
